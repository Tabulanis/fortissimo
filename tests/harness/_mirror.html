<!doctype html><body style="margin:0"><iframe id="f" style="width:1280px;height:720px;border:0"></iframe>
<script type="module">
// the editor (2026-10-08): (1) a click on courtyard geometry selects that PIECE; (2) MIRROR flips the ship in place
// (negative x size, same spot); (3) MIRROR COPY adds a copy on the other side of x = 0. Never saves (his layout stays his).
const say = (b) => fetch("http://127.0.0.1:8899/mirror", { method: "POST", body: JSON.stringify(b) });
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const f = document.getElementById("f");
f.onload = async () => { const w = f.contentWindow, d = w.document; await wait(9000);
  try {
    const cv = d.querySelector("canvas"), E = w.__gr.stage3d.editor, X = w.__grEdit, out = { clicks: [] };
    cv.setPointerCapture = () => {}; cv.releasePointerCapture = () => {};
    const r = cv.getBoundingClientRect();
    for (const [fx, fy] of [[0.12, 0.4], [0.88, 0.4], [0.5, 0.95]]) {   // the colonnades left and right, the floor
      const o = { clientX: r.left + fx * r.width, clientY: r.top + fy * r.height, button: 0, pointerId: 1, bubbles: true };
      cv.dispatchEvent(new w.PointerEvent("pointerdown", o)); cv.dispatchEvent(new w.PointerEvent("pointerup", o));
      out.clicks.push(E.selected ? `${E.selected.userData.editLabel} [${E.selected.userData.editId}]` : null);
    }
    const ship = w.__gr.stage3d.scene.getObjectByName("ship"), V = ship.position.constructor, wp = (o) => o.getWorldPosition(new V()).toArray().map((x) => +x.toFixed(2));
    X.select(ship); const before = wp(ship);
    X.act.mirror(); out.mirror = { before, after: wp(ship), scale: ship.scale.toArray().map((x) => +x.toFixed(2)) };
    const n0 = X.allEditables().length; X.act.mirrorCopy(); await wait(2500);
    out.copy = X.allEditables().slice(n0).map((a) => ({ id: a.userData.editId, kind: a.userData.addKind, pos: wp(a), scale: a.scale.toArray().map((x) => +x.toFixed(2)) }));
    say(out);
  } catch (e) { say({ err: String(e.stack || e) }); }
};
f.src = "/?fly=1&cam=0,3.2,-1.5,0,-0.32";
</script>
