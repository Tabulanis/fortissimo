<!doctype html><body style="margin:0"><iframe id="f" style="width:1400px;height:900px;border:0"></iframe>
<script type="module">
// QUICK PHOTOS of round 4 (10-11): start it, let the robot play, photograph at #at=9,12,15 (seconds after the start) — no full round
const P = new URLSearchParams(location.hash.slice(1)), AT = (P.get("at") || "9,12").split(",").map(Number);
const say = (tag, body) => fetch("http://127.0.0.1:8899/" + tag, { method: "POST", body });
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const KEYS = ["q", "w", "e", "a", "s", "j", "k", "l", "i", "o"];
localStorage.removeItem("gr.run2"); sessionStorage.clear();
const f = document.getElementById("f");
f.onload = async () => { const w = f.contentWindow, d = w.document; if (w.location.href === "about:blank") return;
  try { await wait(4000);
    const press = (k) => { w.dispatchEvent(new w.KeyboardEvent("keydown", { key: k, bubbles: true })); w.dispatchEvent(new w.KeyboardEvent("keyup", { key: k, bubbles: true })); };
    press("x"); let G; for (let i = 0; i < 80 && !((G = w.__gr.game) && G.hydra && G.hydra.active); i++) await wait(250);
    const planned = new Set(), t0 = performance.now(), done = new Set();
    while (performance.now() - t0 < (Math.max(...AT) + 1) * 1000) {
      const now = G.ctx.currentTime;
      for (const u of G.hydra.upcoming()) { const key = u.col + "@" + u.at.toFixed(3); if (planned.has(key) || u.at - now > 0.6) continue; planned.add(key);
        const o = G.ctx.getOutputTimestamp(); setTimeout(() => press(KEYS[u.col]), Math.max(0, o.performanceTime + (u.at + G.calibration - o.contextTime) * 1000 - w.performance.now())); }
      const sec = (performance.now() - t0) / 1000;
      for (const a of AT) if (sec > a && !done.has(a)) { done.add(a); const png = await new Promise((r) => w.requestAnimationFrame(() => r(d.querySelector("canvas").toDataURL("image/png")))); say("png/hydrashot-" + a, png); }
      await wait(40);
    }
    say("hydrashot", "ok " + AT.join(","));
  } catch (e) { say("hydrashot", "ERR " + e.message); } };
f.src = "/?hydra=0,1,2";
</script>
