<!doctype html><body style="margin:0">
<iframe id="f" style="width:1100px;height:760px;border:0"></iframe>
<script type="module">
// ROUND 4 by a robot (2026-10-08 design: drums hold the shield against acid, notes parry the heads' strikes).
// /?hydra=0,1,2. It plays every highway note with ±JITTER ms — BUT leaves the drums alone for the first DRUMLESS
// seconds (the shield must sag and the acid burn through), and skips 1 note in SKIP (bites must land).
// Reports to the sink: hydra-prog / hydra-result / hydra-fail.
const say = (tag, body) => fetch("http://127.0.0.1:8899/" + tag, { method: "POST", body: typeof body === "string" ? body : JSON.stringify(body) });
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const JITTER = 0.05, DRUMLESS = 6, SKIP = 9, SHOT = new URLSearchParams(location.hash.slice(1)).get("shot");   // #shot=SEC: one composed frame (3D + highway) to the sink
const KEYS = ["q", "w", "e", "a", "s", "j", "k", "l", "i", "o"];   // (10-09: five drums, five guns)
localStorage.removeItem("gr.run2"); sessionStorage.clear();
const f = document.getElementById("f");
f.onload = async () => {
  const w = f.contentWindow, d = w.document;
  if (w.location.href === "about:blank") return;
  try {
    await wait(4000);
    const press = (k) => { w.dispatchEvent(new w.KeyboardEvent("keydown", { key: k, bubbles: true })); w.dispatchEvent(new w.KeyboardEvent("keyup", { key: k, bubbles: true })); };
    press("x");
    let G; for (let i = 0; i < 80 && !((G = w.__gr.game) && G.hydra && G.hydra.active); i++) await wait(250);
    if (!G.hydra.active) throw new Error("round 4 never started");
    const planned = new Set(), t0 = performance.now(); let nextLog = 0, n = 0, burnsSeen = 0, bitesSeen = 0;
    while (performance.now() - t0 < 420000) {
      const F = G.hydra.fight, sec = (performance.now() - t0) / 1000;
      for (const u of G.hydra.upcoming()) {
        const id = u.k + ":" + u.it.i + ":" + G.hydra.movement;
        if (planned.has(id) || u.at - G.ctx.currentTime > 0.4) continue;
        planned.add(id);
        if (u.it.drum && sec < DRUMLESS) continue;          // the shield sags…
        if (!u.it.drum && ++n % SKIP === 0) continue;       // …and a strike gets through now and then
        const o = G.ctx.getOutputTimestamp(), T = u.at + (Math.random() * 2 - 1) * JITTER;
        setTimeout(() => press(KEYS[u.col]), Math.max(0, o.performanceTime + (T + G.calibration - o.contextTime) * 1000 - w.performance.now()));
      }
      if (SHOT && sec > +SHOT && !w.__shot) { w.__shot = 1; const gl = d.querySelector("canvas"), hw = d.getElementById("gr-highway"), c = d.createElement("canvas"); c.width = gl.width; c.height = gl.height; const x = c.getContext("2d"); x.drawImage(gl, 0, 0); const r = hw.getBoundingClientRect(), k = gl.width / gl.clientWidth; x.drawImage(hw, r.left * k, r.top * k, r.width * k, r.height * k); fetch("http://127.0.0.1:8899/png/hydra-play", { method: "POST", body: c.toDataURL("image/png") }); }
      if (new URLSearchParams(location.hash.slice(1)).has("dist") && Math.floor(sec) !== w.__ds) { w.__ds = Math.floor(sec); const H = w.__gr.stage3d.hydra, cam = w.__gr.stage3d.camera || null; say("hydra-dist", `${w.__ds}s ` + [0, 1, 2].map((i) => { const m = H.mouth(i); const h = H.heads[i]; return `h${i} mouth ${m.toArray().map((v) => v.toFixed(1)).join(",")} rear ${h.rear.toFixed(2)} lunge ${h.lunge.toFixed(2)} alv ${h.alv.toFixed(2)}`; }).join(" | ")); }
      if (sec * 1000 > nextLog) { nextLog += 15000; say("hydra-prog", `${Math.round(sec)}s life ${F.life} shield ${F.shield.toFixed(2)} heads ${F.heads.map((h) => (h.down ? "X" : h.hp)).join("/")} movement ${G.hydra.movement + 1} bpm ${(60 / G.clock.beatDur).toFixed(1)}`); }
      const res = d.getElementById("gr-results");
      if (res && res.style.display !== "none") { await wait(300); say("hydra-result", { text: res.innerText.replace(/\s+/g, " ").slice(0, 300), life: F.life, won: F.won, lost: F.lost }); return; }
      await wait(20);
    }
    say("hydra-fail", "timed out: " + JSON.stringify({ life: G.hydra.fight.life, heads: G.hydra.fight.heads }));
  } catch (e) { say("hydra-fail", String(e && e.stack || e)); }
};
f.src = "/?hydra=0,1,2" + (SHOT ? "&shot=999" : "");
</script>
