<!doctype html><body style="margin:0">
<iframe id="f" style="width:1100px;height:760px;border:0"></iframe>
<script type="module">
// ROUND 4 by a robot (2026-10-07): /?hydra=0,1,2 — the hydra fight over Rome's three rounds. When a head
// rears, it picks that head's section (1/2/3) and ACCENTS (O) on the strike bar line, ±JITTER ms; it lets
// the FIRST rear go by on purpose (a bite must land). Reports to the sink: hydra-prog / hydra-result / hydra-fail.
const say = (tag, body) => fetch("http://127.0.0.1:8899/" + tag, { method: "POST", body: typeof body === "string" ? body : JSON.stringify(body) });
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const JITTER = 0.06;
localStorage.removeItem("gr.run2"); sessionStorage.clear();
const f = document.getElementById("f");
f.onload = async () => {
  const w = f.contentWindow, d = w.document;
  if (w.location.href === "about:blank") return;
  try {
    await wait(4000);
    const press = (k) => { w.dispatchEvent(new w.KeyboardEvent("keydown", { key: k, bubbles: true })); w.dispatchEvent(new w.KeyboardEvent("keyup", { key: k, bubbles: true })); };
    press("x");   // the audio's gesture: Start, then the count
    let G; for (let i = 0; i < 60 && !((G = w.__gr.game) && G.hydraFight && G.clock); i++) await wait(250);
    if (!G.hydraFight) throw new Error("no hydra fight after Start");
    const seen = new Set(), log = []; let first = true, t0 = performance.now(), nextLog = 0;
    while (performance.now() - t0 < 300000) {
      const F = G.hydraFight, r = F.rearing;
      if (r && !seen.has(r.strikeBar)) {
        seen.add(r.strikeBar);
        const sec = ["drums", "bass", "treble"][r.head];
        if (first) { first = false; log.push(`let bar ${r.strikeBar} (${sec}) go by`); }
        else {
          press(String(r.head + 1));
          const T = G.clock.first + (r.strikeBar - G.hydraBarBase) * 4 * G.clock.beatDur + (Math.random() * 2 - 1) * JITTER, o = G.ctx.getOutputTimestamp();
          setTimeout(() => press("o"), Math.max(0, o.performanceTime + (T + G.calibration - o.contextTime) * 1000 - w.performance.now()));
        }
      }
      if (performance.now() - t0 > nextLog) { nextLog += 20000; say("hydra-prog", `${Math.round((performance.now() - t0) / 1000)}s life ${F.life} heads ${F.heads.map((h) => (h.down ? "X" : h.hp)).join("")} movement ${F.movement + 1} song ${G.song().name} bpm ${(60 / G.clock.beatDur).toFixed(1)}`); }
      const res = d.getElementById("gr-results");
      if (res && res.style.display !== "none") { await wait(300); say("hydra-result", { text: res.innerText.replace(/\s+/g, " ").slice(0, 300), life: F.life, won: F.won, lost: F.lost, log }); return; }
      await wait(25);
    }
    say("hydra-fail", "timed out: " + JSON.stringify({ life: G.hydraFight.life, heads: G.hydraFight.heads, log }));
  } catch (e) { say("hydra-fail", String(e && e.stack || e)); }
};
f.src = "/?hydra=0,1,2";
</script>
