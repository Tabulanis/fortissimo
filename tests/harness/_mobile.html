<!doctype html><body style="margin:0;background:#222">
<iframe id="f" style="border:0"></iframe>
<script>
const say = (tag, body) => fetch("http://127.0.0.1:8899/" + tag, {method: "POST", body: String(body)});
const wait = ms => new Promise(r => setTimeout(r, ms));
const [W, H] = (location.hash.slice(1) || "844x390").split("x").map(Number);
const f = document.getElementById("f");
f.style.width = W + "px"; f.style.height = H + "px";
f.src = "/?quality=mobile";
f.onload = async () => {
  const w = f.contentWindow, d = w.document;
  w.addEventListener("error", e => say("jserror", e.message));
  try {
    await wait(3500);
    [...d.querySelectorAll("button")].find(b => b.textContent.trim() === "Start").click();
    await wait(3000);
    const s = w.__gr.stage3d;
    for (let i = 0; i < 6; i++) s.setDrumVisible(i, true);
    await wait(300);
    const stage = d.getElementById("stage");
    const tap = (x, y, id) => {
      for (const type of ["pointerdown", "pointerup"])
        stage.dispatchEvent(new w.PointerEvent(type, { pointerType: "touch", pointerId: id, isPrimary: true, clientX: x, clientY: y, bubbles: true, cancelable: true }));
    };
    const before = (w.__gr.hits || []).length;
    const p = s.drumScreen(4);                      // tom low (X)
    tap(p.x, p.y, 11);
    tap(W / 2, 20, 12);                             // the sky: should hit nothing
    await wait(200);
    const got = (w.__gr.hits || []).slice(before);
    say("touch", `mobile tier: ${s.mobile}; tom low at ${p.x.toFixed(0)},${p.y.toFixed(0)} r=${p.rad.toFixed(0)}px; hits after 2 taps: ${JSON.stringify(got)}`);
    await wait(1500);
    const shot = await new Promise(r => w.requestAnimationFrame(() => r(d.querySelector("canvas").toDataURL("image/png"))));
    say("shot", shot);
    say("hud", d.getElementById("gr-hud").innerText.replace(/\s+/g, " "));
    say("done", "ok");
  } catch (e) { say("harnesserror", e && e.stack || e); }
};
</script>
