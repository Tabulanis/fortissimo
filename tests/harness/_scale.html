<!doctype html><body style="margin:0">
<!-- EDITOR SIZE handle (2026-10-07, "scale doesn't work"): grab the fountain, press 3 (Size), hover the
gizmo's centre (uniform) box, press, drag up-right, release; report the axis hovered and the scale
before/after. Pointer capture is stubbed (synthetic events have no real pointer). Copy to public/. -->
<iframe id="f" style="width:1280px;height:800px;border:0"></iframe>
<script type="module">
const say = (tag, body) => fetch("http://127.0.0.1:8899/" + tag, { method: "POST", body: JSON.stringify(body) });
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const f = document.getElementById("f");
f.onload = async () => {
  const w = f.contentWindow, d = w.document;
  if (w.location.href === "about:blank") return;
  try {
    w.Element.prototype.setPointerCapture = () => {}; w.Element.prototype.releasePointerCapture = () => {};
    await wait(7000);
    const c = d.querySelector("#stage"), r = c.getBoundingClientRect();
    const P = (t, x, y, b = t === "pointermove" ? -1 : 0) => c.dispatchEvent(new w.PointerEvent(t, { clientX: x, clientY: y, button: b, buttons: t === "pointerup" ? 0 : 1, bubbles: true, pointerId: 1, pointerType: "mouse", isPrimary: true }));
    P("pointerdown", r.left + r.width / 2, r.top + r.height / 2); P("pointerup", r.left + r.width / 2, r.top + r.height / 2);
    await wait(300);
    const E = w.__grEdit, ed = w.__gr.stage3d.editor, sel = ed.selected;
    const out = { selected: sel && sel.userData.editId };
    w.dispatchEvent(new w.KeyboardEvent("keydown", { key: "3", bubbles: true }));
    await wait(200);
    out.mode = E.tc.getMode(); out.scaleBefore = sel.scale.toArray().map((v) => +v.toFixed(3));
    const o = E.screenOf(sel);
    for (const [dx, dy] of [[0, 0], [2, -2]]) { P("pointermove", o.x + dx, o.y + dy); await wait(50); }
    out.axisHover = E.tc.axis;
    P("pointerdown", o.x + 2, o.y - 2); await wait(50);
    out.dragging = E.tc.dragging;
    for (let k = 1; k <= 10; k++) { P("pointermove", o.x + 2 + k * 8, o.y - 2 - k * 8); await wait(30); }
    P("pointerup", o.x + 82, o.y - 82); await wait(200);
    out.scaleAfter = sel.scale.toArray().map((v) => +v.toFixed(3));
    out.panelSize = d.querySelector('input[data-n="s"]').value;
    say("scale", out);
  } catch (e) { say("scale_err", { m: e.message, s: e.stack }); }
};
f.src = "/?fly=1&cam=0,3.2,-1.5,0,-0.32";
</script></body>
