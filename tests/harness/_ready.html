<!doctype html><body style="margin:0">
<iframe id="f" style="width:1100px;height:760px;border:0"></iframe>
<script type="module">
// READY: after Start nothing plays until a key; then 3-2-1 and the song begins
const say = (tag, body) => fetch("http://127.0.0.1:8899/" + tag, { method: "POST", body });
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
localStorage.removeItem("gr.run2");
const f = document.getElementById("f");
f.onload = async () => {
  const w = f.contentWindow, d = w.document, log = [];
  if (w.location.href === "about:blank") return;
  try {
    await wait(3500);
    [...d.querySelectorAll("button")].find((b) => b.textContent.trim() === "Start").click();
    await wait(2500);
    const G = w.__gr.game;
    log.push(`2.5 s after Start: clock ${G.clock ? "RUNNING (bad)" : "not started (good)"}, status "${d.querySelector("#gr-hud .status")?.textContent}"`);
    w.dispatchEvent(new w.KeyboardEvent("keydown", { key: "a", bubbles: true }));
    const stamps = [];
    for (let i = 0; i < 30; i++) { await wait(100); for (const el of d.querySelectorAll(".gr-stamp")) { const s = el.textContent.trim(); if (!stamps.includes(s)) stamps.push(s); } }
    log.push(`after the key: stamps ${JSON.stringify(stamps)}, clock ${G.clock ? "RUNNING at " + G.clock.first.toFixed(2) : "still not started (bad)"}, defend ${G.defend ? "up" : "missing"}`);
    say("info_ready", log.join("\n"));
  } catch (e) { say("err_ready", e.message + " " + e.stack); }
};
f.src = "/?quality=low";
</script>
