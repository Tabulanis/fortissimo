<!doctype html><body style="margin:0">
<iframe id="f" src="/" style="width:1400px;height:900px;border:0"></iframe>
<script type="module">
const say = (tag, body) => fetch("http://127.0.0.1:8899/" + tag, {method: "POST", body: String(body)});
const wait = ms => new Promise(r => setTimeout(r, ms));
const f = document.getElementById("f");
f.onload = async () => {
  const w = f.contentWindow, d = w.document;
  w.addEventListener("error", e => say("jserror", e.message));
  try {
    // install the emulator INSIDE the game frame (its own realm, its own navigator)
    const sc = d.createElement("script"); sc.type = "module";
    sc.textContent = 'import { XRDevice, metaQuest3 } from "/node_modules/iwer/build/iwer.module.min.js"; window.__dev = new XRDevice(metaQuest3); window.__dev.installRuntime();';
    d.head.appendChild(sc);
    while (!w.__dev) await wait(100);
    const dev = w.__dev;
    say("probe", JSON.stringify({iframe: "xr" in w.navigator, parent: "xr" in navigator, secure: w.isSecureContext, gxr: typeof w.XRSession}));
    await wait(3000);
    [...d.querySelectorAll("button")].find(b => b.textContent.trim() === "Start").click();
    await wait(4000);
    const s = w.__gr.stage3d;
    for (let i = 0; i < 6; i++) s.setDrumVisible(i, true);
    const log = [];
    const oStrike = s.strike, oHit = s.hit;
    s.strike = (i, lab) => { log.push(`strike lane ${i} ${lab}`); return oStrike(i, lab); };
    s.hit = (i, t, kind, vel) => { log.push(`judged lane ${i} ${kind} vel ${(+vel).toFixed(2)}`); return oHit(i, t, kind, vel); };
    const btn = s.addVrButton();
    await wait(1500);
    say("button", btn.textContent);
    btn.click();
    await wait(2500);
    say("presenting", s.vr);
    dev.position.set(0, 1.62, 0.1);
    const R = dev.controllers.right, L = dev.controllers.left;
    L.position.set(-0.6, 1.0, 0.0);
    // swing: tip offset from grip is ~(0,-0.17,-0.38); hover over X then strike, twice (soft, hard)
    const swing = async (frames) => {
      for (let k = 0; k <= frames; k++) { R.position.set(-0.47, 1.067 - 0.35 * k / frames, -0.02); await wait(14); }
      for (let k = 0; k <= 10; k++) { R.position.set(-0.47, 0.717 + 0.35 * k / 10, -0.02); await wait(14); }
      await wait(400);
    };
    R.position.set(-0.47, 1.067, -0.02); await wait(500);
    say("tips_hover", JSON.stringify(s.debugVr()));
    for (let k = 0; k <= 4; k++) { R.position.set(-0.47, 1.067 - 0.35 * k / 4, -0.02); await wait(60); }
    say("tips_down", JSON.stringify(s.debugVr()) + " ctrlQ " + JSON.stringify(R.quaternion));
    await wait(400);
    await swing(30);   // slow
    await swing(5);    // fast
    // a miss: swing beside the kit
    for (let k = 0; k <= 6; k++) { R.position.set(1.2, 1.067 - 0.35 * k / 6, -0.02); await wait(14); }
    await wait(300);
    say("log", (log.join("\n") || "no strikes") + "\nHITS " + JSON.stringify(w.__gr.hits || []));
    say("done", "ok");
  } catch (e) { say("harnesserror", e && e.stack || e); }
};
</script>
