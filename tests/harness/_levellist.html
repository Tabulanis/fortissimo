<!doctype html><body style="margin:0"><iframe id="f" style="width:1000px;height:700px;border:0"></iframe>
<script type="module">
// the imported level shows in the menu and its round loads (10-10)
const f = document.getElementById("f"), wait = (ms) => new Promise((r) => setTimeout(r, ms));
localStorage.removeItem("gr.run2"); localStorage.setItem("gr.level", "0");
f.src = "/?quality=low";
f.onload = async () => { const w = f.contentWindow, d = w.document; const out = {};
  try { await wait(6000); [...d.querySelectorAll("#gr-menu button")].find((b) => /^Play|Start/.test(b.textContent.trim()))?.click(); await wait(500);
    const levels = [...d.querySelectorAll("#gr-menu .level")].map((b) => b.textContent.replace(/\s+/g, " ").trim()); out.levels = levels;
    const mine = [...d.querySelectorAll("#gr-menu .level")].find((b) => /Demo Four Part/.test(b.textContent)); out.found = !!mine;
    if (mine) { mine.click(); await wait(400); out.card = (d.querySelector("#gr-menu h2") || {}).textContent; }
  } catch (e) { out.err = String(e); }
  fetch("http://127.0.0.1:8899/levellist", { method: "POST", body: JSON.stringify(out) }); };
</script>
