<!doctype html><body style="margin:0">
<iframe id="f" style="width:1400px;height:900px;border:0"></iframe>
<script type="module">
const say = (tag, body) => fetch("http://127.0.0.1:8899/" + tag, { method: "POST", body });
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
localStorage.removeItem("gr.run2");
const f = document.getElementById("f"); f.src = "/?autobegin=1&quality=high";
f.onload = async () => {
  const w = f.contentWindow, d = w.document;
  try {
    await wait(3500);
    [...d.querySelectorAll("button")].find((b) => b.textContent.trim() === "Start").click();
    await wait(2500);
    const s = w.__gr.stage3d, G = w.__gr.game;
    s.setStation("bass"); await wait(2200);
    if (location.hash === "#pad") s.melodyStations.bass.setLabels("dL dL dD dD dR dR dU dU X X A A B B Y Y".split(" "));
    const now = G.ctx.getOutputTimestamp().contextTime;
    // cannons Q..I are bass 9-16 = targets 14..21; mortars A..K = 6..13; staggered so each shows a different stage
    if (location.hash === "#beat") {
      // beats every 0.5 s from now; one cannon cue on beat 4: sample its button's red each frame
      const t0 = G.ctx.getOutputTimestamp().contextTime;
      s.setBeat(t0, 0.5); s.debugGunCues([{ laneIdx: 14, time: t0 + 2.0 }]);
      const btn = s.melodyStations.bass.bars[8].buttonMat, rows = [];
      await new Promise((r) => { const step = () => { const tt = G.ctx.getOutputTimestamp().contextTime - t0; rows.push([+tt.toFixed(3), +btn.emissive.r.toFixed(3)]); tt < 2.3 ? w.requestAnimationFrame(step) : r(); }; step(); });
      say("info_beat", JSON.stringify(rows)); say("done", "ok"); return;
    }
    s.debugGunCues([0, 1, 2, 3].flatMap((k) => [{ laneIdx: 14 + k * 2, time: now + 0.6 + k * 0.45 }, { laneIdx: 6 + k * 2, time: now + 0.5 + k * 0.4 }]).concat([{ laneIdx: 14, time: now + 0.6 + 1.6 }]));   // cannon Q twice: its queue number shows
    const grab = () => new Promise((r) => w.requestAnimationFrame(() => r(d.querySelector("canvas").toDataURL("image/png"))));
    await wait(250);
    say("info_cues", JSON.stringify(s.debugGunInfo()));
    say("shot_cues", await grab());
    say("done", "ok");
  } catch (e) { say("err", e.message); }
};
</script>
