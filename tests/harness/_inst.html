<!doctype html><body style="margin:0">
<iframe id="f" src="/dev/instruments.html" style="width:1200px;height:700px;border:0"></iframe>
<script>
const say = (tag, body) => fetch("http://127.0.0.1:8899/" + tag, {method: "POST", body: String(body)});
const wait = ms => new Promise(r => setTimeout(r, ms));
const f = document.getElementById("f");
f.onload = async () => {
  const w = f.contentWindow, d = w.document;
  w.addEventListener("error", e => say("jserror", e.message));
  try {
    await wait(800);
    d.getElementById("start").click();
    await wait(2500);
    const bars = (k) => [...d.querySelectorAll(`#row-${k} .bar`)];
    const hits = (k) => bars(k).map((b, i) => b.classList.contains("hit") ? i + 1 : 0).filter(Boolean);
    const log = [`bass bars: ${bars("bass").map(b => b.querySelector(".n").textContent).join(" ")}`,
                 `treble bars: ${bars("treble").map(b => b.querySelector(".n").textContent).join(" ")}`];
    // keyboard: S = note 2 on bass
    w.dispatchEvent(new w.KeyboardEvent("keydown", { key: "s", bubbles: true })); await wait(30);
    log.push(`key S -> bass hits ${JSON.stringify(hits("bass"))}`); await wait(200);
    // fake controller: RB (switch to treble), then D-pad left + Y together
    const mk = (pressed) => ({ id: "Xbox Wireless Controller (test)", buttons: Array.from({ length: 17 }, (_, i) => ({ pressed: pressed.includes(i), value: pressed.includes(i) ? 1 : 0 })), axes: [0, 0, 0, 0] });
    let state = mk([5]);
    w.navigator.getGamepads = () => [state];
    await wait(100); state = mk([]); await wait(100);
    state = mk([14, 3]); await wait(40);
    log.push(`pad RB then D-left + Y -> treble hits ${JSON.stringify(hits("treble"))}, bass hits ${JSON.stringify(hits("bass"))}`);
    log.push(`pad label: ${d.getElementById("pad").textContent}`);
    say("inst", log.join("\n"));
  } catch (e) { say("harnesserror", e.stack || e); }
  say("done", "ok");
};
</script>
