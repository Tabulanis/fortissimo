<!doctype html><body style="margin:0"><iframe id="f" style="width:1100px;height:700px;border:0"></iframe>
<script type="module">
// the final battle's FLIGHT to the altar (10-09): Start, then photograph the camera at 4 moments along the path (to the sink)
const f = document.getElementById("f"), wait = (ms) => new Promise((r) => setTimeout(r, ms));
f.onload = async () => { const w = f.contentWindow, d = w.document; await wait(4000);
  w.dispatchEvent(new w.KeyboardEvent("keydown", { key: "x", bubbles: true }));
  for (let i = 0; i < 40 && !w.__gr.stage3d.flying; i++) await wait(100);
  const t0 = performance.now();
  for (const at of [0.8, 2.8, 4.6, 6.4]) {
    await wait(Math.max(0, at * 1000 - (performance.now() - t0)));
    fetch(`http://127.0.0.1:8899/png/flight-${at}`, { method: "POST", body: d.querySelector("canvas").toDataURL("image/png") });
  }
};
f.src = "/?hydra=0,1,2&shot=999";
</script>
