<!doctype html><body style="margin:0"><iframe id="f" style="width:1100px;height:800px;border:0"></iframe>
<script type="module">
// THE SONG IMPORTER in the editor (10-10): pick Demo-FourPart, import, read what it says
const f = document.getElementById("f"), wait = (ms) => new Promise((r) => setTimeout(r, ms));
f.src = "/?fly=1&quality=low";
f.onload = async () => { const w = f.contentWindow, d = w.document; const out = {};
  try { let sel = null; for (let i = 0; i < 40 && !sel; i++) { await wait(300); sel = d.querySelector("[data-i=project]"); }
    out.panel = !!sel; out.projects = sel ? sel.options.length : 0;
    sel.value = "Demo-FourPart"; sel.dispatchEvent(new w.Event("change")); d.querySelector("[data-i=title]").value = "Demo Four Part";
    d.querySelector("[data-i=go]").click();
    let text = ""; for (let i = 0; i < 60; i++) { await wait(500); text = d.querySelector("[data-i=out]").textContent; if (/Imported|failed/.test(text)) break; }
    out.result = text;
  } catch (e) { out.err = String(e); }
  fetch("http://127.0.0.1:8899/import", { method: "POST", body: JSON.stringify(out) }); };
</script>
