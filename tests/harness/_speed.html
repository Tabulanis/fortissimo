<!doctype html><body style="margin:0">
<!-- Speed-fix check (2026-10-05): loads the game at the default tier, clicks Start, lets it play
~25 s. Proof lands in device.log: a "samples" line (ogg vs wav counts) and a
"graphics check" line with when:"in play". Copy of tests/harness/_speed.html. -->
<iframe id="f" style="width:1100px;height:760px;border:0"></iframe>
<script type="module">
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
localStorage.removeItem("gr.autoTier"); localStorage.setItem("gr.level", "0");
const f = document.getElementById("f");
f.onload = async () => {
  const w = f.contentWindow, d = w.document;
  if (w.location.href === "about:blank") return;
  // #pad=1: pretend a standard controller is plugged in (the labels should switch to its buttons)
  if (location.hash.includes("pad=1")) { const pad = { id: "fake", index: 0, connected: true, mapping: "standard", timestamp: 0, axes: [0, 0, 0, 0], buttons: Array.from({ length: 17 }, () => ({ pressed: false, touched: false, value: 0 })) };
    w.navigator.getGamepads = () => [pad]; }
  await wait(3500);
  [...d.querySelectorAll("button")].find((b) => b.textContent.trim() === "Start").click();
};
f.src = "/?autobegin=1" + (location.hash ? "&" + location.hash.slice(1).replace(/&?pad=1/, "") : "");   // #shot=14 etc. pass through to the game
</script></body>
