<!doctype html><body style="margin:0">
<!-- Plays every song part note-perfect with the bell, reports locks + which ghost hands show. Copy to public/_robot.html, run sink.py on :8899, open in headless Firefox. Occasionally flaky on its clock-waits: rerun once before believing a failure. -->
<iframe id="f" src="/" style="width:1400px;height:900px;border:0"></iframe>
<script type="module">
import { SONG } from "/src/game/stages.js";
const say = (tag, body) => fetch("http://127.0.0.1:8899/" + tag, {method: "POST", body: String(body)});
const wait = ms => new Promise(r => setTimeout(r, ms));
const KEY = { hat: "q", snare: "w", crash: "e", kick: "z", "tom low": "x", "tom high": "c" };
const f = document.getElementById("f");
f.onload = async () => {
  const w = f.contentWindow, d = w.document;
  w.addEventListener("error", e => say("jserror", e.message));
  try {
    await wait(3000);
    [...d.querySelectorAll("button")].find(b => b.textContent.trim() === "Start").click();
    await wait(3000);
    const G = w.__gr.game, s = w.__gr.stage3d;
    const press = (k) => { w.dispatchEvent(new w.KeyboardEvent("keydown", { key: k, bubbles: true })); w.dispatchEvent(new w.KeyboardEvent("keyup", { key: k, bubbles: true })); };
    // press key k when the HEARD clock reaches T (same mapping the game uses)
    const at = (T, k) => {
      const o = G.ctx.getOutputTimestamp();
      const P = o.performanceTime + (T + G.calibration - o.contextTime) * 1000;
      setTimeout(() => press(k), Math.max(0, P - performance.now()));
    };
    const log = [];
    const variant = location.hash.slice(1) || "perfect";
    for (let p = 0; p < SONG.parts.length; p++) {
      const idx = G.stageIdx;
      press(" ");                                  // ring the bell
      await wait(50);
      const rs = G.bell.recordStart, bd = G.clock.beatDur;
      for (const n of SONG.parts[idx].part) at(rs + n.beat * bd, KEY[n.lane]);
      // wait for the bar to finish and the bell to judge
      const end = rs + 4 * bd + 0.3;
      while (G.ctx.getOutputTimestamp().contextTime < end) await wait(50);
      await wait(200);
      const msg = (d.body.innerText.match(/Locked in[^\n]*|Not quite[^\n]*/) || ["(no message)"])[0];
      log.push(`part ${idx + 1}: ${msg}  -> stage now ${G.stageIdx + 1}, bell ${G.bell.state}`);
      if (G.stageIdx === idx) { // didn't lock: try once more
        press(" "); await wait(50);
        const rs2 = G.bell.recordStart;
        for (const n of SONG.parts[idx].part) at(rs2 + n.beat * bd, KEY[n.lane]);
        while (G.ctx.getOutputTimestamp().contextTime < rs2 + 4 * bd + 0.3) await wait(50);
        await wait(200);
        log.push(`  retry: ${(d.body.innerText.match(/Locked in[^\n]*|Not quite[^\n]*/) || ["(no message)"])[0]} -> stage ${G.stageIdx + 1}`);
      }
    }
    say("locks", log.join("\n"));
    // ghosts: sample which ghost hands show over two bars
    const seen = [0, 0, 0, 0, 0, 0];
    const t0 = performance.now();
    while (performance.now() - t0 < 8 * G.clock.beatDur * 1000) {
      const vis = s.debugGhosts(); vis.forEach((v, i) => { if (v) seen[i]++; });
      if (!s._shot && vis.filter(Boolean).length >= 3) { s._shot = 1;
        const shot = await new Promise(r => w.requestAnimationFrame(() => r(d.querySelector("canvas").toDataURL("image/png"))));
        say("shot_ghosts", shot); say("ghostsvisible", JSON.stringify(vis)); }
      await wait(16);
    }
    say("ghosts", "frames visible per lane [hat, snare, crash, kick, tom low, tom high]: " + JSON.stringify(seen) + "\nloop layers: " + JSON.stringify((G.loops.layers || G.loops._layers || []).map(l => [...new Set(l.hits.map(h => h.lane))])));
    say("done", "ok");
  } catch (e) { say("harnesserror", e && e.stack || e); }
};
</script>
