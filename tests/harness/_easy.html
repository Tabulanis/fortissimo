<!doctype html><body style="margin:0">
<iframe id="f" style="width:1200px;height:800px;border:0"></iframe>
<script type="module">
const out = [], wait = (ms) => new Promise((r) => setTimeout(r, ms));
const KEY = { hat: "q", snare: "w", crash: "e", kick: "z", "tom low": "x", "tom high": "c" };
localStorage.removeItem("gr.run2");   // the default run: Easy
const f = document.getElementById("f");
f.src = "/";
f.onload = async () => {
  const w = f.contentWindow, d = w.document;
  w.addEventListener("error", (e) => out.push("JSERROR " + e.message));
  try {
    await wait(3000);
    [...d.querySelectorAll("button")].find((b) => b.textContent.trim() === "Start").click();
    await wait(1500);
    const G = w.__gr.game;
    const h = G.hint;
    out.push(`preview after Start: ${h ? h.notes.length + " notes, message: " + (d.body.innerText.match(/👂[^\n]*/) || ["?"])[0] : "none"}`);
    out.push(`step 1: ${G.song().parts[0].label} = ${G.part().map((n) => n.lane + "@" + (n.beat + 1)).join(" ")}`);
    if (h) while (G.ctx.getOutputTimestamp().contextTime < h.end + 0.1) await wait(50);
    const press = (k) => { w.dispatchEvent(new w.KeyboardEvent("keydown", { key: k, bubbles: true })); w.dispatchEvent(new w.KeyboardEvent("keyup", { key: k, bubbles: true })); };
    const at = (T, k) => { const o = G.ctx.getOutputTimestamp(); setTimeout(() => press(k), Math.max(0, o.performanceTime + (T + G.calibration - o.contextTime) * 1000 - w.performance.now())); };
    press(" "); await wait(50);
    const P = G.part(), half = Math.ceil(P.length / 2), bd = G.clock.beatDur, bar = 4 * bd;
    let rs = G.bell.recordStart;
    P.slice(0, half).forEach((n) => at(rs + n.beat * bd, KEY[n.lane]));
    P.slice(half).forEach((n) => at(rs + bar + n.beat * bd, KEY[n.lane]));
    const msgs = [];
    const t0 = G.ctx.currentTime;
    while (G.ctx.getOutputTimestamp().contextTime < rs + 2 * bar + 0.6) {
      const m = (d.body.innerText.match(/Locked in[^\n]*|Not quite[^\n]*/) || [""])[0];
      if (m && msgs[msgs.length - 1] !== m) msgs.push(m);
      await wait(40);
    }
    out.push(`half, then the other half: ${msgs.join("  ->  ") || "(no message)"}; now on step ${G.stageIdx + 1}`);
  } catch (e) { out.push("ERROR " + e.message + " " + e.stack); }
  fetch("http://127.0.0.1:8899/easy", { method: "POST", body: out.join("\n") });
};
</script>
