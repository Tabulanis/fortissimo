<!doctype html><body style="margin:0">
<iframe id="f" style="width:1000px;height:700px;border:0"></iframe>
<script type="module">
const out = [], wait = (ms) => new Promise((r) => setTimeout(r, ms));
localStorage.removeItem("gr.run2");
const f = document.getElementById("f"); f.src = "/?autobegin=1&quality=low";
f.onload = async () => {
  const w = f.contentWindow, d = w.document;
  w.addEventListener("error", (e) => out.push("JSERROR " + e.message));
  try {
    await wait(3000);
    [...d.querySelectorAll("button")].find((b) => b.textContent.trim() === "Start").click();
    await wait(2000);
    const G = w.__gr.game, S = G.song(), pool = G.pool, ctx = G.ctx;
    // 1 + 3. a bass bar played with a note written an octave down
    const bassLane = Object.keys(S.sounds).find((l) => l.startsWith("bass")), bs = S.sounds[bassLane];
    const ls = G.laneSound({ name: bassLane, kind: "bass", slot: 0 }, bs.note - 12);
    out.push(`bass "${bassLane}": bar note ${bs.note}, played written ${ls.midi} | channel ${ls.channel} mono ${ls.mono} | tone filter velToCutoff ${ls.settings.velToCutoff}`);
    const v1 = pool.noteOn({ ...ls, velocity: 0.9, when: ctx.currentTime + 0.05 });
    out.push(`  sounds at rate ${v1.rate.toFixed(3)} (an octave down = 0.5 x the bar's ${Math.pow(2, (bs.note - 60) / 12).toFixed(3)})`);
    // 2. mono: a second note on the same track cuts the first
    const v2 = pool.noteOn({ ...G.laneSound({ name: bassLane, kind: "bass", slot: 0 }), velocity: 0.9, when: ctx.currentTime + 0.3 });
    out.push(`mono: first note released when the second came: ${v1.released}; second still playing: ${!v2.released}`);
    // 4. the whole song at once, every track, backgrounds full -> the level into the final clipper
    const all = S.notes.map((n) => ({ lane: n.lane, pos: n.beat * G.clock.beatDur, velocity: 1, midi: n.midi }));
    G.loops.add({ bars: S.bars, startBar: 0, hits: all });
    G.setBackLevel(1);   // the end of a round: every background at full
    const an = ctx.createAnalyser(); an.fftSize = 2048; G.mixer.master.connect(an);
    const buf = new Float32Array(2048); let peak = 0; const t0 = performance.now();
    while (performance.now() - t0 < 10000) { an.getFloatTimeDomainData(buf); for (const v of buf) peak = Math.max(peak, Math.abs(v)); await wait(15); }
    out.push(`whole song at once (${all.length} notes/loop) + backgrounds at full: peak into the clipper ${peak.toFixed(3)} (clipper starts at 0.700)`);
  } catch (e) { out.push("ERROR " + e.message + " " + e.stack); }
  fetch("http://127.0.0.1:8899/mix", { method: "POST", body: out.join("\n") });
};
</script>
