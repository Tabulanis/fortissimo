<!doctype html><body style="margin:0">
<iframe id="f" style="width:1100px;height:760px;border:0"></iframe>
<script type="module">
// A WHOLE SONG on Easy by a robot that plays every cue (drums + guns) with human slop
// (±JITTER ms); logs progress every 20 s, then the results panel. #jitter=60 to change it.
const say = (tag, body) => fetch("http://127.0.0.1:8899/" + tag, { method: "POST", body });
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const JITTER = +(new URLSearchParams(location.hash.slice(1)).get("jitter") || 60) / 1000;
localStorage.removeItem("gr.run2");
// #round=1 plays Round 2 (the game remembers the menu's pick in gr.level)
localStorage.setItem("gr.level", new URLSearchParams(location.hash.slice(1)).get("round") || "0");
const KEY = { hat: "q", snare: "w", crash: "e", kick: "a", "tom low": "s", "tom high": "d" };
for (const k of ["bass", "treble"]) "asdfghjkqwertyui".split("").forEach((c, i) => (KEY[`${k} ${i + 1}`] = c));
const f = document.getElementById("f");
f.onload = async () => {
  const w = f.contentWindow, d = w.document;
  if (w.location.href === "about:blank") return;
  const log = [];
  try {
    await wait(3500);
    [...d.querySelectorAll("button")].find((b) => b.textContent.trim() === "Start").click();
    await wait(1000);
    const G = w.__gr.game;
    const press = (k) => { w.dispatchEvent(new w.KeyboardEvent("keydown", { key: k, bubbles: true })); w.dispatchEvent(new w.KeyboardEvent("keyup", { key: k, bubbles: true })); };
    const at = (T, k) => { const o = G.ctx.getOutputTimestamp(); setTimeout(() => press(k), Math.max(0, o.performanceTime + (T + G.calibration - o.contextTime) * 1000 - w.performance.now())); };
    const planned = new Set(), t0 = performance.now();
    let nextLog = 0;
    while (performance.now() - t0 < 560000) {
      const now = G.ctx.getOutputTimestamp().contextTime;
      for (const a of G.upcoming()) {
        const key = a.laneIdx + "@" + a.time.toFixed(3);
        if (!planned.has(key) && a.time - now < 0.6) { planned.add(key); at(a.time + (Math.random() * 2 - 1) * JITTER, KEY[G.laneOf(a.laneIdx)]); }
      }
      if (performance.now() - t0 > nextLog) {
        const D = G.defend, S = G.siege;
        log.push(`${Math.round((performance.now() - t0) / 1000)}s ${D.section || "done"} ${Math.round(100 * D.locked.size / D.notes.length)}% locked | life ${G.life.you.toFixed(0)}/${G.life.town.toFixed(0)} | shield ${S.full ? (S.broken ? "BROKEN" : S.hp.toFixed(0)) : "rise " + S.rise.toFixed(2)} | army ${S.enemies.filter((e) => e.alive).length}${S.boss ? " boss " + S.boss.hp + "/" + S.boss.of : ""}`);
        nextLog += 20000;
        say("prog_full", log.join("\n"));
      }
      const r = d.getElementById("gr-results");
      if (r && r.style.display !== "none" && r.innerText.trim()) { await wait(500); log.push("RESULTS: " + r.innerText.replace(/\s+/g, " ").slice(0, 300)); break; }
      await wait(40);
    }
    say("info_full", log.join("\n"));
  } catch (e) { say("err_full", e.message + " " + e.stack + "\n" + log.join("\n")); }
};
f.src = "/?autobegin=1&quality=low";
</script>
