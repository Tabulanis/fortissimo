<!doctype html><body style="margin:0"><iframe id="f" style="width:1280px;height:720px;border:0"></iframe>
<script type="module">
// FULL SONG mode (10-10): every note streams from the start; a robot that hits ~70% of them; locked count must climb, the stream thin
const f = document.getElementById("f"), wait = (ms) => new Promise((r) => setTimeout(r, ms)), say = (k, b) => fetch("http://127.0.0.1:8899/" + k, { method: "POST", body: b });
const KEY = { hat: "q", snare: "w", crash: "e", kick: "a", "tom low": "s", "tom high": "d" };
const PP = new URLSearchParams(location.hash.slice(1)); localStorage.setItem("gr.run2", JSON.stringify({ stream: PP.get("s") || "all", density: PP.get("d") || "easy", hitbox: 0.25, tempo: 1, damage: "gentle" })); if (PP.get("lvl")) localStorage.setItem("gr.level", PP.get("lvl")); localStorage.setItem("gr.level", "0");
f.src = "/?autobegin=1&quality=medium";
f.onload = async () => { const w = f.contentWindow, d = w.document; const out = { t: [] };
  try { await wait(5000); [...d.querySelectorAll("button")].find((b) => b.textContent.trim() === "Start").click(); await wait(2500);
    const G = w.__gr.game, D = G.defend; out.mode = { all: D.all, keep: D.keep, lock: D.lockSize, notes: D.notes.length, drumNotes: D.sectionNotes("drums").length };
    out.part = d.getElementById("gr-hud").innerText.match(/FULL SONG[^\n]*/)?.[0] || "(no label)"; out.offeredAtStart = D.offered().length;
    const press = (k) => { w.dispatchEvent(new w.KeyboardEvent("keydown", { key: k, bubbles: true })); w.dispatchEvent(new w.KeyboardEvent("keyup", { key: k, bubbles: true })); };
    const at = (T, k) => { const o = G.ctx.getOutputTimestamp(); setTimeout(() => press(k), Math.max(0, o.performanceTime + (T + G.calibration - o.contextTime) * 1000 - w.performance.now())); };
    const planned = new Set(), t0 = performance.now(); let shot = false;
    while (performance.now() - t0 < 50000) {
      const now = G.ctx.getOutputTimestamp().contextTime;
      for (const a of G.upcoming()) { const key = a.laneIdx + "@" + a.time.toFixed(3), lane = G.laneOf(a.laneIdx); if (!planned.has(key) && a.time - now < 0.6 && KEY[lane]) { planned.add(key); if (Math.random() < 0.7) at(a.time + (Math.random() - 0.5) * 0.04, KEY[lane]); } }
      const s = Math.round((performance.now() - t0) / 1000);
      if (s % 10 === 0 && !out.t.some((x) => x.s === s)) out.t.push({ s, locked: D.locked.size, open: D.unlocked().length, inFlight: D.offered().length, life: G.life.you });
      if (!shot && s >= +(PP.get("at") || 6)) { shot = true; const png = await new Promise((r) => w.requestAnimationFrame(() => r(d.querySelector("canvas").toDataURL("image/png")))); say("png/fullsong", png); }
      await wait(40);
    }
    out.label = d.getElementById("gr-hud").innerText.match(/locked \d+\/\d+/)?.[0];
  } catch (e) { out.err = String(e) + (e.stack || "").slice(0, 200); }
  say("fullsong", JSON.stringify(out)); };
</script>
