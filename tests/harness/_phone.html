<!doctype html><body style="margin:0;background:#222">
<iframe id="f" style="border:0"></iframe>
<script type="module">
// what a PHONE sees: the drums, then the bass guns, then the boss — at #WxH (default landscape 844x390)
const say = (tag, body) => fetch("http://127.0.0.1:8899/" + tag, { method: "POST", body: String(body) });
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const [W, H] = (location.hash.slice(1) || "844x390").split("x").map(Number);
const f = document.getElementById("f");
f.style.width = W + "px"; f.style.height = H + "px";
localStorage.removeItem("gr.run2");
f.onload = async () => {
  const w = f.contentWindow, d = w.document;
  if (w.location.href === "about:blank") return;
  const grab = () => new Promise((r) => w.requestAnimationFrame(() => r(d.querySelector("canvas").toDataURL("image/png"))));
  try {
    await wait(3500);
    [...d.querySelectorAll("button")].find((b) => b.textContent.trim() === "Start").click();
    await wait(2500);
    const s = w.__gr.stage3d;
    say(`shot_phone_${W}x${H}_drums`, await grab());
    s.setStation("bass"); await wait(2200);
    say(`shot_phone_${W}x${H}_bass`, await grab());
    s.setStation("treble"); await wait(2200);
    say(`shot_phone_${W}x${H}_treble`, await grab());
    say("info_phone", `${W}x${H} done`);
  } catch (e) { say("err_phone", e.message + " " + e.stack); }
};
f.src = "/?autobegin=1&quality=mobile&mobile=1";
</script>
