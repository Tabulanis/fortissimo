f.onload = () => setTimeout(() => { const w = f.contentWindow, S = w.__gr.stage3d.scene, out = [];
  S.traverse((o) => { if (o.name !== n) return; let v = true; for (let p = o; p; p = p.parent) if (!p.visible) v = false;
