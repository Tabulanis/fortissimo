<!doctype html><body style="margin:0"><iframe id="f" src="/" style="width:1280px;height:720px;border:0"></iframe><script>
const say=(t,b)=>fetch("http://127.0.0.1:8899/"+t,{method:"POST",body:b});
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const grab=(w,c)=>new Promise(r=>w.requestAnimationFrame(()=>r(c.toDataURL("image/jpeg",0.9))));
f.onload=async()=>{const w=f.contentWindow,d=w.document; const c=d.querySelector("#stage");
 try{[...d.querySelectorAll("button")].find(b=>/start/i.test(b.textContent)).click(); await wait(4200);
  say("g0",await grab(w,c)); say("done","ok");}catch(e){say("harnesserror",String(e.stack||e));}};
</script>
