<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Garden Rhythm</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      #stage { display: block; width: 100vw; height: 100vh; }
      #chart {
        position: fixed;
        display: none;   /* developer timing chart: H toggles */
        bottom: 0;
        left: 0;
        width: 100vw;
        height: 120px;
        pointer-events: none;
        z-index: 10;
      }
      #hud { position: fixed; left: 0; bottom: 4px; padding: 2px 8px; font: 11px monospace; color: #8f8; opacity: 0.55; z-index: 20; pointer-events: none; }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <canvas id="chart"></canvas>
    <div id="hud"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
